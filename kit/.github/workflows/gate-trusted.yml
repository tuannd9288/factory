# The job that reads the pull request as data. On pull_request_target GitHub runs main's copy of this file, and the job
# runs main's scripts from ./trusted, whatever the pull request changes. It does not run the candidate's code, which runs
# only in gate.yml on pull_request, and it restores no Actions cache, which this event shares with main. No job here calls a
# model or holds a reviewer's credential (FAC-100).
#   tier     the tier, from the paths and every label the pull request ever had (FAC-100). It waits for nothing. It labels the tier
#            (`pull-requests: write`, which also, while it waits for the Human's approval, requests the code owners' review,
#            #374, and writes the risk score comment for Linear's Reviews, #379). On tier 3 it reads the merge switch (the
#            review parameters of the rules in force), and unless the switch is at all asks the Human's approval of the head,
#            or of a commit whose patch the head carries unchanged. After his approval the queue re-runs it. It is red unless
#            the issue the body's `Issue:` names is open (`issues: read`) and `Claim:` is that issue's claim ref's tip
#            (.gate/bin/lib/claim.mjs check).
# The required checks are verify (gate.yml) and tier (.gate/ruleset.json). No required job here has `needs`: a job skipped
# because a job it needs failed counts as passing. No job counts a pull request's red heads: the three-round rule is the
# workers' (FAC-100).
# GATE_REVIEWER below and every job's runs-on are the repository's own settings, which bin/onboard fills in and a pull
# request changes, at tier 3 (#335): no repository variable holds them, since one changes without a pull request. The
# runner is GitHub-hosted Ubuntu in the kit, and never a runner a candidate's, main's or a deploy's job uses, nor one
# another workflow can reach, for the tier job holds a token that writes labels, and it alone asks for the Human's
# approval and checks the claim (.gate/enforced-rules.md, which names the Human's one exception, with GATE_REVIEWER=entire).
name: gate-trusted

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: gate-trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Read by no job: no reviewer runs on Actions (FAC-100). bin/onboard fills it in until the gate's settings drop it.
  GATE_REVIEWER: ''
  BASE: ${{ github.event.pull_request.base.sha }}
  HEAD: ${{ github.event.pull_request.head.sha }}
  GATE_HEAD: ${{ github.event.pull_request.head.sha }}
  GATE_PR: ${{ github.event.pull_request.number }}

jobs:
  tier:
    name: tier
    runs-on: ["ubuntu-latest"]
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Fetch the candidate's commits, with no work tree
        run: git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags --quiet origin "$HEAD"
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          printf '%s\n' "$BODY" >"$RUNNER_TEMP/pr-body.txt"
          GATE_BODY_FILE="$RUNNER_TEMP/pr-body.txt" .gate/bin/review tier --base "$BASE" --head "$HEAD" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
        working-directory: trusted
        env:
          GATE_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
