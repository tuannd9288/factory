# The jobs that read the pull request as data. On pull_request_target GitHub runs main's copy of this file, and every
# job runs main's scripts from ./trusted, whatever the pull request changes. None runs the candidate's code, which
# runs only in gate.yml on pull_request, and none restores an Actions cache, which this event shares with main.
#   review   reads the candidate as data: its commits are fetched into main's checkout with no work tree. It waits for
#            gate.yml's verify on the head and runs the reviewer, once per head (a push is a new head; an edit that leaves
#            head, base, the No-red line and the closing issues alone reuses the earlier result), only after it passed.
#            For GATE_REVIEWER=claude it first reads the issues of this repository the pull request closes (`gh pr view`,
#            `gh issue view`, so `issues: read` and `pull-requests: read`) and hands them over as data. It is told when the
#            job started and how long it may run (GATE_JOB_START, GATE_JOB_MINUTES), so a call is sized to the time left. The
#            reviewer's credential (CLAUDE_CODE_OAUTH_TOKEN for GATE_REVIEWER=claude) comes from the environment "reviewer",
#            whose branch policy admits main alone; Claude Code is the pinned one of .gate/bin/reviewer, installed with
#            `npm ci --ignore-scripts`, whose `claude` is the platform package's binary (the .bin link is a placeholder
#            until a postinstall script, which does not run, replaces it) and which the install step runs for its version.
#   verdict  makes no reviewer call: from tier 2 it waits for `review` of its own run and passes with its result for the
#            same head and base (`actions: read` lists the run's jobs and `checks: read` their annotations). It holds no
#            environment and no secret.
#   tier     the tier, from the paths and every label the pull request ever had (FAC-100). It waits for nothing. It labels the tier
#            (`pull-requests: write`, which also, while it waits for the Human's approval, requests the code owners' review,
#            #374, and writes the risk score comment for Linear's Reviews, #379). On tier 3 it reads the merge switch (the
#            review parameters of the rules in force), and unless the switch is at all asks the Human's approval of the head,
#            or of a commit whose patch the head carries unchanged. After his approval the queue re-runs it. It is red unless
#            the issue the body's `Issue:` names is open (`issues: read`) and `Claim:` is that issue's claim ref's tip
#            (.gate/bin/lib/claim.mjs check). The job timeouts follow the largest GATE_VERIFY_TIMEOUT (60 minutes,
#            .gate/bin/verify-timeout --max): review 90 (its wait for verify and the reviewer's 30), verdict 100, tier 105. A
#            pull request whose head is in another repository is refused by the first step of `review`, which is red, never
#            skipped.
#   With GATE_REVIEWER=entire (#155) Entire reviews outside Actions: `review` passes at once and `verdict` on its verdict.
# The required checks are verify (gate.yml), review, verdict and tier (.gate/ruleset.json); with GATE_REVIEWER=entire,
# verify, tier and Entire Gates (bin/onboard-owner writes that ruleset from GATE_REVIEWER as main holds it). No required job
# here has `needs`: a job skipped because a job it needs failed counts as passing. No job counts a pull request's red heads:
# the three-round rule is the workers' (FAC-100).
# GATE_REVIEWER below and every job's runs-on are the repository's own settings, which bin/onboard fills in and a pull
# request changes, at tier 3 (#335): no repository variable holds them, since one changes without a pull request. The
# runner is GitHub-hosted Ubuntu in the kit, and never a runner a candidate's, main's or a deploy's job uses, nor one
# another workflow can reach, for these jobs hold the reviewer's credential and a token that writes labels
# (.gate/enforced-rules.md, which names the Human's one exception, with GATE_REVIEWER=entire). With the Claude
# reviewer, verdict waits for review and review for verify, so runners shared with verify must take three jobs at once;
# with Entire, only verdict waits, for review, and two do.
name: gate-trusted

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: gate-trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Which reviewer `review` runs: stub, claude or entire, filled in by bin/onboard. Empty, review and verdict fail closed.
  # pull_request_target runs main's copy of this file, so a pull request cannot change its own reviewer.
  GATE_REVIEWER: ''
  BASE: ${{ github.event.pull_request.base.sha }}
  HEAD: ${{ github.event.pull_request.head.sha }}
  GATE_HEAD: ${{ github.event.pull_request.head.sha }}
  GATE_PR: ${{ github.event.pull_request.number }}

jobs:
  review:
    name: review
    runs-on: ["ubuntu-latest"]
    environment: reviewer
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      # First, before the checkout, the install and the step that reads the credential: a pull request whose head is in another
      # repository (a fork) is refused, red. A job-level `if:` would show the job skipped, and a skipped required job counts as
      # passing. An empty head (a deleted fork) is a refusal too: the test is "the same repository", not "another one". The
      # result is the unavailable class `fork`.
      - name: Refuse a pull request from another repository
        run: |
          if [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::notice title=review-result::unavailable: fork"
            echo "review: this pull request's head is not in this repository (a fork, or a deleted one), so the reviewer, which holds a credential, does not run on it; open the branch in this repository"
            exit 1
          fi
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.id }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.id }}
      - name: Note when the job started
        run: echo "GATE_JOB_START=$(date +%s)" >>"$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Fetch the candidate's commits, with no work tree
        run: git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags --quiet origin "$HEAD"
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install the pinned Claude Code
        if: env.GATE_REVIEWER == 'claude'
        run: |
          # A failed install is the reviewer being unavailable, not a finding on the change, and no red round.
          down() { echo "::notice title=review-result::unavailable: not-installed"; echo "review: reviewer unavailable (not-installed); $1"; exit 1; }
          npm ci --ignore-scripts --prefix .gate/bin/reviewer --no-audit --no-fund || down "npm ci failed"
          bin="$PWD/.gate/bin/reviewer/node_modules/@anthropic-ai/claude-code-linux-x64"
          want=$(node -p "require('./.gate/bin/lib/reviewer.json').version")
          got=$("$bin/claude" --version) || down "the installed claude does not run"
          case "$got" in "$want "*) ;; *) down "the installed claude is '$got', not $want" ;; esac
          echo "$bin" >>"$GITHUB_PATH"
        working-directory: trusted
      - run: |
          printf '%s\n' "$BODY" >"$RUNNER_TEMP/pr-body.txt"
          GATE_BODY_FILE="$RUNNER_TEMP/pr-body.txt" .gate/bin/review review --base "$BASE" --head "$HEAD"
        working-directory: trusted
        env:
          GATE_JOB_MINUTES: '90'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}

  verdict:
    name: verdict
    runs-on: ["ubuntu-latest"]
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Fetch the candidate's commits, with no work tree
        run: git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags --quiet origin "$HEAD"
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
      - run: .gate/bin/review verdict --base "$BASE" --head "$HEAD"
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}

  tier:
    name: tier
    runs-on: ["ubuntu-latest"]
    timeout-minutes: 105
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Fetch the candidate's commits, with no work tree
        run: git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags --quiet origin "$HEAD"
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          printf '%s\n' "$BODY" >"$RUNNER_TEMP/pr-body.txt"
          GATE_BODY_FILE="$RUNNER_TEMP/pr-body.txt" .gate/bin/review tier --base "$BASE" --head "$HEAD" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
        working-directory: trusted
        env:
          GATE_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
