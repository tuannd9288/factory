# The one job that runs the candidate's code: main's verify and red-check on it (.gate/bin/verify-trusted), main's
# scripts checked out from the pull request's base. It runs on pull_request, not pull_request_target: it writes only
# the pull request's own Actions cache, never one main's or a deploy's jobs restore, and it holds no secret and a
# read-only token. GitHub runs the candidate's copy of this file, so a change to it is a .gate/protected path: tier 3,
# the Human's approval. The runner is the repository variable GATE_PR_RUNNER (a JSON label list, as main.yml's
# GATE_RUNNER), GitHub-hosted Ubuntu when unset; never a runner that holds a secret or runs main's or a deploy's jobs, and
# a self-hosted one only when it is ephemeral and the two-job canary proved it clean (.gate/enforced-rules.md). The verify
# step's timeout is GATE_VERIFY_TIMEOUT in main's .gate/config.sh, read by the step before it.
name: gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ${{ fromJSON(vars.GATE_PR_RUNNER || '"ubuntu-latest"') }}
    # The ceiling: the largest GATE_VERIFY_TIMEOUT (.gate/bin/verify-timeout --max) and the checkouts and setup. The verify
    # step below is bound by the repository's own value.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # A main whose kit predates #133 has no verify-timeout; its own gate.yml gave verify 30 minutes. One that is there and
      # fails, fails the job.
      - id: cfg
        name: Read the verify timeout from main's .gate/config.sh
        run: |
          if [ -e .gate/bin/verify-timeout ]; then
            minutes=$(.gate/bin/verify-timeout) || exit 1
          else
            minutes=30
          fi
          echo "minutes=$minutes" >>"$GITHUB_OUTPUT"
        working-directory: trusted
      - run: |
          printf '%s\n' "$BODY" >"$RUNNER_TEMP/pr-body.txt"
          GATE_BODY_FILE="$RUNNER_TEMP/pr-body.txt" .gate/bin/verify-trusted ../candidate "$BASE"
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.minutes) }}
        working-directory: trusted
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BODY: ${{ github.event.pull_request.body }}
