# The one job that runs the candidate's code: main's verify and red-check on it (.gate/bin/verify-trusted), main's
# scripts checked out from the pull request's base. It runs on pull_request, not pull_request_target: it writes only
# the pull request's own Actions cache, never one main's or a deploy's jobs restore, and it holds no secret and a
# read-only token. GitHub runs the candidate's copy of this file, so a change to it is a .gate/protected path: tier 3,
# the Human's approval. It runs on a GitHub-hosted runner, never on a self-hosted one that also runs main's or a
# deploy's jobs, where the candidate's code could leave something behind for them.
name: gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          printf '%s\n' "$BODY" >"$RUNNER_TEMP/pr-body.txt"
          GATE_BODY_FILE="$RUNNER_TEMP/pr-body.txt" .gate/bin/verify-trusted ../candidate "$BASE"
        working-directory: trusted
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BODY: ${{ github.event.pull_request.body }}
