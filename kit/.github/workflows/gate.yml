# The candidate's own checks: they run the pull request's code with a read-only token and no secrets.
# The trusted half is gate-trusted.yml. No job here may be skipped by a condition: a skipped job satisfies a required
# check. The runner is the repository variable GATE_RUNNER (a JSON label list), hosted Ubuntu when it is unset.
# Every job pins Node 24, which the kit's scripts run on, whatever the runner has installed.
name: gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ${{ fromJSON(vars.GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: scripts/setup --ci
      - run: GATE_BASE=$(git merge-base "$BASE" HEAD) scripts/verify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  rules:
    name: rules
    runs-on: ${{ fromJSON(vars.GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: scripts/rules --base "$(git merge-base "$BASE" HEAD)"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  red-check:
    name: red-check
    runs-on: ${{ fromJSON(vars.GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: scripts/setup --ci
      - run: |
          printf '%s\n' "$BODY" >"$RUNNER_TEMP/pr-body.txt"
          scripts/red-check --base "$(git merge-base "$BASE" HEAD)" --body "$RUNNER_TEMP/pr-body.txt"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BODY: ${{ github.event.pull_request.body }}
