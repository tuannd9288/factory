# Verify on main after each merge: main's own checks on the merged tree, so a red main shows on the commit that made
# it. A pull request's checks are in gate.yml and gate-trusted.yml. Only main's code runs here, so this job may use
# the repository variable GATE_RUNNER (a JSON label list; hosted Ubuntu when unset), a runner no candidate job uses.
# Node is main's .node-version, else 24, which the kit's scripts need at least, and pnpm the version its package.json's
# packageManager names (#155), set up whatever the runner has installed.
name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify on main
    runs-on: ${{ fromJSON(vars.GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The repository's own Node and pnpm (#155): Node from .node-version, else 24, and pnpm from package.json's
      # packageManager. The kit's scripts need Node 24 or later. A version that is not plain fails the step.
      - id: tools
        name: Read the Node and pnpm versions the repository names
        shell: bash
        run: |
          node=24
          if [ -f .node-version ]; then node=$(tr -d ' \t\r\n' <.node-version); node=${node#v}; fi
          pnpm=""
          if [ -f package.json ]; then pnpm=$(sed -n 's/.*"packageManager" *: *"pnpm@\([^"]*\)".*/\1/p' package.json | head -n 1); pnpm=${pnpm%%+*}; fi
          plain='^[0-9]+(\.[0-9]+){0,2}$'
          [[ $node =~ $plain ]] || { echo "gate: .node-version holds no plain Node version, such as 24 or 26.3.0"; exit 1; }
          [ -z "$pnpm" ] || [[ $pnpm =~ $plain ]] || { echo "gate: package.json's packageManager names no plain pnpm version, such as pnpm@11.1.2"; exit 1; }
          printf 'node=%s\npnpm=%s\n' "$node" "$pnpm" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.tools.outputs.pnpm != ''
        with:
          version: ${{ steps.tools.outputs.pnpm }}
      - run: .gate/bin/setup --ci
      - run: GATE_BASE=$(git rev-parse HEAD^1) .gate/bin/verify
