# Verify on main after each merge: main's own checks on the merged tree, so a red main shows on the commit that made
# it. A pull request's checks are in gate.yml and gate-trusted.yml. Only main's code runs here, so this job may use
# the repository variable GATE_RUNNER (a JSON label list; hosted Ubuntu when unset), a runner no candidate job uses.
# Node 24, which the kit's scripts run on, is pinned whatever the runner has installed.
name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify on main
    runs-on: ${{ fromJSON(vars.GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: scripts/setup --ci
      - run: GATE_BASE=$(git rev-parse HEAD^1) scripts/verify
