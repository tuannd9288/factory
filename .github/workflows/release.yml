# The factory's releases (INN-40 item 5): a version's GitHub Release, whose notes are the tag's own section of CHANGELOG.md
# (scripts/release-notes), published as written in the release pull request he approved. It creates no tag.
# - On the push of a `v*` tag, which item 3 cuts on his word on the release pull request's merge commit.
# - By hand for an existing tag, the retry path: `gh workflow run release.yml -f tag=vX.Y.Z`. That runs main's copy of this file and
#   of scripts/release-notes, and still reads CHANGELOG.md at the tag, so a failed first run is fixed by a pull request and a
#   re-run, never by a new tag.
# It fails, and publishes nothing, when CHANGELOG.md at the tag has no section for it. A tag that already has a release changes
# nothing: a published release keeps the notes it was published with, and a correction is a line in the next version's section.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing version tag, such as v1.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "release: $TAG is not a version tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Release notes
        run: |
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null || { echo "release: there is no tag $TAG"; exit 1; }
          git show "refs/tags/$TAG:CHANGELOG.md" > "$RUNNER_TEMP/changelog.md" || { echo "release: $TAG has no CHANGELOG.md"; exit 1; }
          scripts/release-notes "$TAG" "$RUNNER_TEMP/changelog.md" > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release: $TAG already has a release; nothing changes"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
