# The same patch approval as the served repositories' tier job, re-run by the queue after approval.
# Only the base's script and CODEOWNERS run; the candidate is fetched as git objects.
# As tier does, it first reads the merge switch from the rules in force on the base branch (kit/.gate/bin/lib/switch.mjs):
# at all it asks no approval and passes; a switch it cannot read fails it.
name: approval

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval:
    name: approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Read the merge switch
        id: switch
        run: |
          position=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/rules/branches/$BASE_REF" 2>&1 | node kit/.gate/bin/lib/switch.mjs) ||
            { echo "approval: the merge switch could not be read ($position)"; exit 1; }
          echo "approval: the merge switch is at $position"
          echo "position=$position" >> "$GITHUB_OUTPUT"
      - name: Fetch the candidate's commits, with no work tree
        if: steps.switch.outputs.position != 'all'
        run: git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags --quiet origin "$HEAD"
      - name: Require approval of the head or its unchanged patch
        if: steps.switch.outputs.position != 'all'
        run: |
          reviews=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews")
          moved=$(node kit/.gate/bin/lib/history.mjs moved --repo "$GITHUB_REPOSITORY" --pr "$PR") || { echo "approval: the base changes could not be read ($moved)"; exit 1; }
          printf '%s' "$reviews" | node kit/.gate/bin/lib/approval.mjs --owners .github/CODEOWNERS --author "$AUTHOR" --head "$HEAD" --base "$BASE" ${moved:+--moved-at "${moved%% *}" --parent-head "${moved#* }"}
